<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Система обліку студентів{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="bg-dark text-white py-3">
        <div class="container d-flex justify-content-between align-items-center gap-3">
            <a class="text-white text-decoration-none fs-5" href="{{ url_for('web.index') }}">
                Система обліку студентів
            </a>

            <div class="notification-area" id="notification-area">
                <button class="notification-toggle" id="notification-toggle"
                        type="button" aria-label="Сповіщення" aria-expanded="false"
                        aria-controls="notification-menu">
                    <span aria-hidden="true">🔔</span>
                    <span class="notification-count{% if unread_notifications_count == 0 %} d-none{% endif %}"
                          id="notification-count"
                          data-unread-count="{{ unread_notifications_count }}">
                        {{ unread_notifications_count if unread_notifications_count <= 99 else '99+' }}
                    </span>
                </button>

                <section class="notification-menu d-none" id="notification-menu"
                         aria-label="Останні сповіщення">
                    <div class="notification-menu-header">
                        <strong>Сповіщення</strong>
                        <button type="button"
                                class="btn btn-sm btn-link p-0{% if unread_notifications_count == 0 %} d-none{% endif %}"
                                id="notification-mark-all">
                            Позначити всі прочитаними
                        </button>
                    </div>
                    <div class="notification-list" id="notification-list">
                        {% for item in recent_notifications %}
                            <button type="button"
                                    class="notification-item{% if not item.is_read %} unread{% endif %}"
                                    data-notification-id="{{ item.id }}"
                                    data-notification-read="{{ 'true' if item.is_read else 'false' }}">
                                <span class="notification-item-title">{{ item.title }}</span>
                                <span class="notification-item-message">{{ item.message }}</span>
                                <span class="notification-item-date">
                                    {{ item.created_at.strftime('%d.%m.%Y %H:%M') }}
                                </span>
                            </button>
                        {% else %}
                            <p class="notification-empty" id="notification-empty">
                                Поки що сповіщень немає.
                            </p>
                        {% endfor %}
                    </div>
                </section>
            </div>
        </div>
    </header>

    <nav class="bg-white border-bottom" aria-label="Основна навігація">
        <div class="container">
            <ul class="nav flex-wrap py-2">
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'web.index' %} active fw-semibold{% endif %}"
                       {% if request.endpoint == 'web.index' %}aria-current="page"{% endif %}
                       href="{{ url_for('web.index') }}">Головна</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'web.university' %} active fw-semibold{% endif %}"
                       {% if request.endpoint == 'web.university' %}aria-current="page"{% endif %}
                       href="{{ url_for('web.university') }}">Структура університету</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'web.students' %} active fw-semibold{% endif %}"
                       {% if request.endpoint == 'web.students' %}aria-current="page"{% endif %}
                       href="{{ url_for('web.students') }}">Студенти</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'web.teachers' %} active fw-semibold{% endif %}"
                       {% if request.endpoint == 'web.teachers' %}aria-current="page"{% endif %}
                       href="{{ url_for('web.teachers') }}">Викладачі</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'web.subjects' %} active fw-semibold{% endif %}"
                       {% if request.endpoint == 'web.subjects' %}aria-current="page"{% endif %}
                       href="{{ url_for('web.subjects') }}">Дисципліни</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'web.schedule' %} active fw-semibold{% endif %}"
                       {% if request.endpoint == 'web.schedule' %}aria-current="page"{% endif %}
                       href="{{ url_for('web.schedule') }}">Розклад</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'web.grades' %} active fw-semibold{% endif %}"
                       {% if request.endpoint == 'web.grades' %}aria-current="page"{% endif %}
                       href="{{ url_for('web.grades') }}">Успішність</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link{% if request.endpoint == 'web.reports' %} active fw-semibold{% endif %}"
                       {% if request.endpoint == 'web.reports' %}aria-current="page"{% endif %}
                       href="{{ url_for('web.reports') }}">Звіти</a>
                </li>
            </ul>
        </div>
    </nav>

    <main class="container py-4">
        <div id="api-message" class="alert d-none" role="alert"></div>
        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
